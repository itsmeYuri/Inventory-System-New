<!-- Archive Modal -->
<div id="archiveModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-[60] hidden" style="left: 60px;">
    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] overflow-hidden animation-slide-up flex flex-col">
        <div class="flex items-center justify-between p-6 border-b border-border-light dark:border-gray-700 flex-shrink-0">
            <div>
                <h2 class="text-xl font-semibold text-text-primary dark:text-gray-100">Archive</h2>
                <p class="text-sm text-text-secondary dark:text-gray-400 mt-1">View expired items and cancelled orders</p>
            </div>
            <button id="closeArchiveModal" class="text-text-tertiary dark:text-gray-400 hover:text-text-secondary dark:hover:text-gray-200 transition-colors duration-200">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <div class="space-y-6">
                <!-- Summary Cards -->
                <div class="metric-cards" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
                    <div class="metric-card metric-card--danger">
                        <div class="metric-card__top"></div>
                        <div class="metric-card__body">
                            <p class="metric-card__label">Expired Items</p>
                            <p id="expiredCountModal" class="metric-card__value">0</p>
                        </div>
                    </div>
                    <div class="metric-card metric-card--warning">
                        <div class="metric-card__top"></div>
                        <div class="metric-card__body">
                            <p class="metric-card__label">Cancelled Orders</p>
                            <p id="cancelledCountModal" class="metric-card__value">0</p>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-md border border-border-light dark:border-gray-700">
                    <div class="border-b border-border-light dark:border-gray-700">
                        <nav class="flex -mb-px">
                            <button id="tabExpiredModal" class="tab-button-modal active px-6 py-4 text-sm font-medium border-b-2 border-primary text-primary dark:text-primary-400">
                                <i class="fas fa-exclamation-triangle mr-2"></i>
                                Expired Items
                            </button>
                            <button id="tabCancelledModal" class="tab-button-modal px-6 py-4 text-sm font-medium border-b-2 border-transparent text-text-secondary dark:text-gray-400 hover:text-text-primary dark:hover:text-gray-200">
                                <i class="fas fa-ban mr-2"></i>
                                Cancelled Orders
                            </button>
                        </nav>
                    </div>

                    <!-- Tab Content -->
                    <div class="p-6">
                        <!-- Expired Items Tab -->
                        <div id="contentExpiredModal" class="tab-content-modal">
                            <div class="component__table">
                                <table class="w-full">
                                    <thead>
                                        <tr>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Medicine</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Batch</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Quantity</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Expiration Date</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Days Expired</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Expired At</th>
                                        </tr>
                                    </thead>
                                    <tbody id="expiredItemsTableModal">
                                        <tr class="--empty">
                                            <td colspan="6" class="px-6 py-12 text-center text-text-tertiary dark:text-gray-500">Loading...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Cancelled Orders Tab -->
                        <div id="contentCancelledModal" class="tab-content-modal hidden">
                            <div class="component__table">
                                <table class="w-full">
                                    <thead>
                                        <tr>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Order ID</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Supplier</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Order Date</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Total Amount</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Items</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Cancelled At</th>
                                            <th class="px-6 py-4 text-left text-xs font-bold uppercase tracking-wider">Reason</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cancelledOrdersTableModal">
                                        <tr class="--empty">
                                            <td colspan="7" class="px-6 py-12 text-center text-text-tertiary dark:text-gray-500">Loading...</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
