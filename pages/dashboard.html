<script>
// Settings Modal - Simplified (no tabs needed for basic settings)
</script>

    <script>

        // Theme management
        function initializeTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const isDark = savedTheme === 'dark';
            
            console.log('Initializing theme:', savedTheme, 'isDark:', isDark);
            
            // Ensure we start with light mode if no theme is saved
            if (!localStorage.getItem('theme')) {
                localStorage.setItem('theme', 'light');
            }
            
            document.documentElement.classList.toggle('dark', isDark);
            
            // Update toggle buttons
            const toggles = document.querySelectorAll('#themeToggle, #settingsThemeToggle');
            const toggleButtons = document.querySelectorAll('#themeToggleButton');
            
            console.log('Found toggles:', toggles.length);
            console.log('Found toggle buttons:', toggleButtons.length);
            
            toggles.forEach(toggle => {
                toggle.classList.toggle('bg-primary', isDark);
                toggle.classList.toggle('bg-border-light', !isDark);
            });
            
            toggleButtons.forEach(button => {
                button.classList.toggle('translate-x-6', isDark);
                button.classList.toggle('translate-x-1', !isDark);
            });
            
            console.log('Theme initialization completed');
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            
            console.log('Current theme:', isDark ? 'dark' : 'light');
            console.log('Switching to:', newTheme);
            
            document.documentElement.classList.toggle('dark', !isDark);
            localStorage.setItem('theme', newTheme);
            
            // Update toggle buttons
            const toggles = document.querySelectorAll('#themeToggle, #settingsThemeToggle');
            const toggleButtons = document.querySelectorAll('#themeToggleButton');
            
            console.log('Found toggles:', toggles.length);
            console.log('Found toggle buttons:', toggleButtons.length);
            
            toggles.forEach(toggle => {
                toggle.classList.toggle('bg-primary', !isDark);
                toggle.classList.toggle('bg-border-light', isDark);
            });
            
            toggleButtons.forEach(button => {
                button.classList.toggle('translate-x-6', !isDark);
                button.classList.toggle('translate-x-1', isDark);
            });
            
            console.log('Theme toggle completed');
        }

        // Navigation functions
        function filterLowStock() {
            window.location.href = 'inventory_management.html?filter=low-stock';
        }

        function viewAllActivities() {
            // Navigate to inventory management with activities filter
            window.location.href = 'inventory_management.html?filter=recent';
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        // Initialize dashboard functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize theme
            initializeTheme();

            // Check authentication
            if (!localStorage.getItem('isLoggedIn')) {
                window.location.href = 'login.html';
                return;
            }

            // Set user display info (sidebar elements may not be loaded yet)
            const userEmail = localStorage.getItem('userEmail') || 'admin@pharmacy.com';
            const userDisplayEmailEl = document.getElementById('userDisplayEmail');
            const userDisplayNameEl = document.getElementById('userDisplayName');
            
            if (userDisplayEmailEl) {
                userDisplayEmailEl.textContent = userEmail;
            }
            
            // Set display name based on email
            if (userDisplayNameEl) {
                const displayNames = {
                    'admin@pharmacy.com': 'Pharmacy Admin',
                    'manager@pharmacy.com': 'Pharmacy Manager',
                    'pharmacist@pharmacy.com': 'Lead Pharmacist'
                };
                userDisplayNameEl.textContent = displayNames[userEmail] || 'Pharmacist';
            }

            // Clock is now initialized by load-topbar.js

            // Initialize FullCalendar
            const calendarEl = document.getElementById('calendar');
            if (calendarEl) {
                window.calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek'
                    },
                    events: [],
                    height: 'auto',
                    eventDisplay: 'block',
                    eventClick: function(info) {
                        showCalendarEventModal(info);
                    },
                    dayHeaderContent: function(arg) {
                        return arg.text;
                    },
                    eventContent: function(arg) {
                        const title = arg.event.title || 'Event';
                        return {
                            html: `<div class="fc-event-main-frame">
                                <div class="fc-event-title-container">
                                    <div class="fc-event-title fc-sticky">${title}</div>
                                </div>
                            </div>`
                        };
                    },
                    loading: function(isLoading) {
                        if (isLoading) {
                            console.log('Calendar is loading...');
                        } else {
                            console.log('Calendar finished loading');
                        }
                    }
                });
                window.calendar.render();
                console.log('Calendar initialized successfully');
            } else {
                console.error('Calendar element not found');
            }

            // Low stock chart will be initialized in loadLowStockChart()

            // Theme toggle is now initialized by load-topbar.js


            // Settings modal
            const closeSettingsModal = document.getElementById('closeSettingsModal');
            if (closeSettingsModal) {
                closeSettingsModal.addEventListener('click', () => {
                    const settingsModal = document.getElementById('settingsModal');
                    if (settingsModal) settingsModal.classList.add('hidden');
                });
            }




            // Logout functionality (sidebar handles this, but keep for compatibility)
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    if (confirm('Are you sure you want to logout?')) {
                        localStorage.removeItem('isLoggedIn');
                        localStorage.removeItem('userEmail');
                        window.location.href = 'login.html';
                    }
                });
            }

            // Global search functionality
            const searchInput = document.getElementById('globalSearch');
            if (searchInput) {
                let searchTimeout;
                searchInput.addEventListener('input', function(e) {
                const searchTerm = e.target.value.trim();
                
                clearTimeout(searchTimeout);
                
                    if (searchTerm.length > 2) {
                        searchTimeout = setTimeout(() => {
                            // Navigate to inventory with search filter
                            window.location.href = `inventory_management.html?search=${encodeURIComponent(searchTerm)}`;
                        }, 500);
                    }
                });
                
                // Allow Enter key to search immediately
                searchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const searchTerm = e.target.value.trim();
                        if (searchTerm.length > 0) {
                            window.location.href = `inventory_management.html?search=${encodeURIComponent(searchTerm)}`;
                        }
                    }
                });
            }

            // ESC key to close modals
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('settingsModal').classList.add('hidden');
                }
            });

            // Setup order details modal
            const orderDetailsModal = document.getElementById('orderDetailsModal');
            const closeDetailsModal = document.getElementById('closeDetailsModal');
            if (closeDetailsModal) {
                closeDetailsModal.addEventListener('click', () => {
                    orderDetailsModal.classList.add('hidden');
                });
            }
            if (orderDetailsModal) {
                orderDetailsModal.addEventListener('click', (e) => {
                    if (e.target === orderDetailsModal) {
                        orderDetailsModal.classList.add('hidden');
                    }
                });
            }

            // Setup calendar event modal

        // Show expiration notification
        function showExpirationNotification(expiredCount, expiringSoonCount) {
            // Check if notification already shown in this session
            const notificationKey = 'expiration_notification_shown';
            const lastShown = sessionStorage.getItem(notificationKey);
            const now = Date.now();
            
            // Show notification if not shown in last 5 minutes
            if (!lastShown || (now - parseInt(lastShown)) > 300000) {
                const message = expiredCount > 0 
                    ? `⚠️ Alert: ${expiredCount} medicine(s) have expired${expiringSoonCount > 0 ? ` and ${expiringSoonCount} are expiring soon` : ''}!`
                    : `${expiringSoonCount} medicine(s) are expiring within 30 days!`;
                
                // Show visual notification
                showNotification(message, 'warning');
                
                sessionStorage.setItem(notificationKey, now.toString());
            }
        }

        // Notification system
        function showNotification(message, type = 'info') {
            // Remove any existing notifications
            const existing = document.querySelector('.expiration-notification');
            if (existing) existing.remove();

            // Create notification element
            const notification = document.createElement('div');
            notification.className = `expiration-notification fixed top-4 right-4 z-50 px-6 py-4 rounded-lg shadow-lg text-white transform transition-all duration-300 ${
                type === 'success' ? 'bg-success-600' : 
                type === 'error' ? 'bg-error-600' : 
                type === 'warning' ? 'bg-warning-600' : 
                'bg-primary-600'
            }`;
            notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas ${type === 'warning' ? 'fa-exclamation-triangle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'}"></i>
                    <span>${message}</span>
                    <button onclick="this.parentElement.parentElement.remove()" class="ml-4 text-white hover:text-gray-200">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.style.opacity = '0';
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => notification.remove(), 300);
                }
            }, 5000);
        }

        // Load Calendar Events
        async function loadCalendarEvents() {
            try {
                const apiUrl = `${getDashboardApiUrl()}?action=calendar`;
                console.log('Loading calendar events from:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                console.log('Calendar events API response:', result);

                if (result.success && result.data && Array.isArray(result.data)) {
                    const calendarEl = document.getElementById('calendar');
                    if (calendarEl && window.calendar) {
                        // Remove all existing events
                        window.calendar.removeAllEvents();
                        
                        // Add new events
                        const eventsAdded = [];
                        result.data.forEach(event => {
                            try {
                                // Ensure the event has required properties
                                if (event.start && event.title) {
                                    const calendarEvent = {
                                        id: event.id || `event_${Date.now()}_${Math.random()}`,
                                        title: event.title,
                                        start: event.start,
                                        color: event.color || '#3B82F6',
                                        extendedProps: event.extendedProps || {}
                                    };
                                    
                                    window.calendar.addEvent(calendarEvent);
                                    eventsAdded.push(calendarEvent);
                                } else {
                                    console.warn('Invalid event data:', event);
                                }
                            } catch (eventError) {
                                console.error('Error adding event to calendar:', eventError, event);
                            }
                        });
                        
                        // Refresh the calendar to ensure events are displayed
                        window.calendar.render();
                        
                        console.log(`Successfully loaded ${eventsAdded.length} calendar events`);
                        
                        // Show a message if no events were found
                        if (eventsAdded.length === 0) {
                            console.info('No calendar events found. Make sure medicines have expiration dates set.');
                        }
                    } else {
                        console.error('Calendar element or calendar instance not found');
                    }
                } else {
                    console.warn('Calendar events API returned unsuccessful response:', result);
                    if (result.message) {
                        console.error('API Error:', result.message);
                    }
                }
            } catch (error) {
                console.error('Error loading calendar events:', error);
                console.error('Error details:', {
                    message: error.message,
                    stack: error.stack
                });
            }
        }

        // Helper function for time ago
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} minute${minutes > 1 ? 's' : ''} ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} day${days > 1 ? 's' : ''} ago`;
            return date.toLocaleDateString();
        }

            const normalizedStatus = (status || '').toLowerCase().trim();
            const statusClasses = {
                'pending': 'bg-warning-100 dark:bg-warning-900 text-warning-700 dark:text-warning-300',
                'completed': 'status-success bg-success-100 dark:bg-success-900 text-success-700 dark:text-success-300',
                'shipping': 'bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300',
                'shipped': 'bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300',

                'canceled': 'bg-error-100 dark:bg-error-900 text-error-700 dark:text-error-300'
            };
            return statusClasses[normalizedStatus] || 'bg-surface-hover dark:bg-gray-800 text-text-secondary dark:text-gray-400';

        function getStatusIcon(status) {
            const normalizedStatus = (status || '').toLowerCase().trim();
            const statusIcons = {
                'pending': '<i class="fas fa-clock mr-1"></i>',
                'completed': '<i class="fas fa-check mr-1"></i>',
                'shipping': '<i class="fas fa-shipping-fast mr-1"></i>',
                'shipped': '<i class="fas fa-truck mr-1"></i>',
                'cancelled': '<i class="fas fa-times mr-1"></i>',
                'canceled': '<i class="fas fa-times mr-1"></i>'
            };
            return statusIcons[normalizedStatus] || '';
        }

                        <div class="pt-4 border-t border-border-light dark:border-gray-700">
                            <h3 class="text-lg font-medium text-text-primary dark:text-gray-100 mb-4">Order Items</h3>
                            ${orderItems && orderItems.length > 0 ? `
                                <div class="overflow-x-auto">
                                    <table class="min-w-full divide-y divide-border-light dark:divide-gray-700">
                                        <thead class="bg-surface-hover dark:bg-gray-800">
                                            <tr>
                                                <th class="px-4 py-3 text-left text-xs font-medium text-text-secondary dark:text-gray-400 uppercase">Medicine</th>
                                                <th class="px-4 py-3 text-left text-xs font-medium text-text-secondary dark:text-gray-400 uppercase">NDC</th>
                                                <th class="px-4 py-3 text-left text-xs font-medium text-text-secondary dark:text-gray-400 uppercase">Quantity</th>
                                                <th class="px-4 py-3 text-left text-xs font-medium text-text-secondary dark:text-gray-400 uppercase">Unit Price</th>
                                                <th class="px-4 py-3 text-left text-xs font-medium text-text-secondary dark:text-gray-400 uppercase">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody class="bg-white dark:bg-gray-900 divide-y divide-border-light dark:border-gray-700">
                                            ${orderItems.map(item => {
                                                const itemTotal = (parseFloat(item.quantity) || 0) * (parseFloat(item.price) || 0);
                                                const medicineName = item.medicine_name || item.name || 'N/A';
                                                const ndc = item.ndc || 'N/A';
                                                const quantity = item.quantity || 0;
                                                const price = parseFloat(item.price) || 0;
                                                return `
                                                    <tr>
                                                        <td class="px-4 py-3 text-sm text-text-primary dark:text-gray-100">${escapeHtml(medicineName)}</td>
                                                        <td class="px-4 py-3 text-sm text-text-secondary dark:text-gray-400">${escapeHtml(ndc)}</td>
                                                        <td class="px-4 py-3 text-sm text-text-primary dark:text-gray-100 font-medium">${quantity}</td>
                                                        <td class="px-4 py-3 text-sm text-text-secondary dark:text-gray-400">₱${price.toFixed(2)}</td>
                                                        <td class="px-4 py-3 text-sm text-text-primary dark:text-gray-100 font-semibold">₱${itemTotal.toFixed(2)}</td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            ` : `
                                <div class="text-center py-8">
                                    <i class="fas fa-box-open text-3xl text-text-tertiary dark:text-gray-500 mb-2 opacity-50"></i>
                                    <p class="text-text-secondary dark:text-gray-400">No items found for this order.</p>
                                    <p class="text-xs text-text-tertiary dark:text-gray-500 mt-2">Items count: ${orderItems ? orderItems.length : 0}</p>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error fetching order details:', error);
                console.error('Order ID:', orderId);
                console.error('API Base URL:', getApiBaseUrl());
                detailsContent.innerHTML = `
                    <div class="text-center py-8">
                        <i class="fas fa-exclamation-triangle text-2xl text-error mb-2"></i>
                        <p class="text-text-secondary dark:text-gray-400">Failed to load order details.</p>
                        <p class="text-xs text-text-tertiary dark:text-gray-500 mt-2">${error.message || 'Unknown error'}</p>
                        <button onclick="viewOrderDetails('${orderId}')" class="mt-4 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-700 transition-colors duration-200 text-sm">
                            <i class="fas fa-redo mr-2"></i>Retry
                        </button>
                    </div>
                `;
            }
        }

        // Show Calendar Event Modal
        function showCalendarEventModal(info) {
            const modal = document.getElementById('calendarEventModal');
            const titleEl = document.getElementById('calendarEventTitle');
            const contentEl = document.getElementById('calendarEventContent');
            
            if (!modal || !titleEl || !contentEl) {
                console.error('Calendar event modal elements not found');
                return;
            }

            const props = info.event.extendedProps;
            const eventType = props.type || 'unknown';
            const eventDate = new Date(info.event.startStr);
            const formattedDate = eventDate.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });

            let title = '';
            let content = '';

            if (eventType === 'expiration') {
                const isExpired = props.isExpired || false;
                const status = props.status || 'unknown';
                const quantity = props.quantity || 0;
                const batchNumber = props.batchNumber ? `Batch #${props.batchNumber}` : 'No batch';
                const medicineName = info.event.title.replace(' (Expires)', '').replace(' (Expired)', '');
                
                title = '📦 Medicine Expiration';
                content = `
                    <div class="space-y-4">
                        <div class="flex items-center space-x-3 p-4 bg-primary-50 dark:bg-primary-900 rounded-xl">
                            <div class="w-12 h-12 bg-primary-600 dark:bg-primary-500 rounded-xl flex items-center justify-center">
                                <i class="fas fa-capsules text-white text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-text-primary dark:text-gray-100">${escapeHtml(medicineName)}</h3>
                                <p class="text-sm text-text-secondary dark:text-gray-400">Expiration Alert</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Expiry Date</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${formattedDate}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Quantity</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${quantity}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Batch Number</label>
                                <p class="text-text-primary dark:text-gray-100">${escapeHtml(batchNumber)}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Stock Status</label>
                                <p class="text-text-primary dark:text-gray-100 capitalize">${escapeHtml(status)}</p>
                            </div>
                        </div>

                        <div class="p-4 rounded-xl ${isExpired ? 'bg-error-50 dark:bg-error-900 border border-error-200 dark:border-error-700' : 'bg-success-50 dark:bg-success-900 border border-success-200 dark:border-success-700'}">
                            <div class="flex items-center space-x-2">
                                <i class="fas ${isExpired ? 'fa-exclamation-triangle text-error-600 dark:text-error-400' : 'fa-check-circle text-success-600 dark:text-success-400'}"></i>
                                <span class="font-semibold ${isExpired ? 'text-error-700 dark:text-error-300' : 'text-success-700 dark:text-success-300'}">
                                    ${isExpired ? '⚠️ EXPIRED' : '✅ Active'}
                                </span>
                            </div>
                            <p class="text-sm ${isExpired ? 'text-error-600 dark:text-error-400' : 'text-success-600 dark:text-success-400'} mt-1">
                                ${isExpired ? 'This medicine has expired and should be removed from inventory.' : 'This medicine is still active and within expiration date.'}
                            </p>
                        </div>
                    </div>
                `;
            } else if (eventType === 'order') {
                const orderId = props.orderId || 'N/A';
                const status = props.status || 'unknown';
                const supplierName = props.supplierName || 'Unknown Supplier';
                const itemCount = props.itemCount || 0;
                
                title = '🛒 Order Details';
                content = `
                    <div class="space-y-4">
                        <div class="flex items-center space-x-3 p-4 bg-secondary-50 dark:bg-secondary-900 rounded-xl">
                            <div class="w-12 h-12 bg-secondary-600 dark:bg-secondary-500 rounded-xl flex items-center justify-center">
                                <i class="fas fa-shopping-cart text-white text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-text-primary dark:text-gray-100">Order #${orderId}</h3>
                                <p class="text-sm text-text-secondary dark:text-gray-400">Order Information</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Order Date</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${formattedDate}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Status</label>
                                <span class="status-badge ${getStatusClass(status)}">
                                    ${getStatusIcon(status)}
                                    ${(status || '').charAt(0).toUpperCase() + (status || '').slice(1)}
                                </span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Supplier</label>
                                <p class="text-text-primary dark:text-gray-100">${escapeHtml(supplierName)}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Items Count</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${itemCount} item(s)</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (eventType === 'batch_expiration') {
                const batchNumber = props.batchNumber ? `#${props.batchNumber}` : 'N/A';
                const quantity = props.quantity || 0;
                const isExpired = props.isExpired || false;
                const medicineName = props.medicineName || 'Unknown Medicine';
                
                title = '📋 Batch Expiration';
                content = `
                    <div class="space-y-4">
                        <div class="flex items-center space-x-3 p-4 bg-warning-50 dark:bg-warning-900 rounded-xl">
                            <div class="w-12 h-12 bg-warning-600 dark:bg-warning-500 rounded-xl flex items-center justify-center">
                                <i class="fas fa-boxes text-white text-xl"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-semibold text-text-primary dark:text-gray-100">${escapeHtml(medicineName)}</h3>
                                <p class="text-sm text-text-secondary dark:text-gray-400">Batch Expiration Alert</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Batch Number</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${escapeHtml(batchNumber)}</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Quantity</label>
                                <p class="text-text-primary dark:text-gray-100 font-medium">${quantity}</p>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-text-secondary dark:text-gray-400 mb-1">Expiry Date</label>
                            <p class="text-text-primary dark:text-gray-100">${formattedDate}</p>
                        </div>

                        <div class="p-4 rounded-xl ${isExpired ? 'bg-error-50 dark:bg-error-900 border border-error-200 dark:border-error-700' : 'bg-success-50 dark:bg-success-900 border border-success-200 dark:border-success-700'}">
                            <div class="flex items-center space-x-2">
                                <i class="fas ${isExpired ? 'fa-exclamation-triangle text-error-600 dark:text-error-400' : 'fa-check-circle text-success-600 dark:text-success-400'}"></i>
                                <span class="font-semibold ${isExpired ? 'text-error-700 dark:text-error-300' : 'text-success-700 dark:text-success-300'}">
                                    ${isExpired ? '⚠️ EXPIRED' : '✅ Active'}
                                </span>
                            </div>
                            <p class="text-sm ${isExpired ? 'text-error-600 dark:text-error-400' : 'text-success-600 dark:text-success-400'} mt-1">
                                ${isExpired ? 'This batch has expired and should be removed from inventory.' : 'This batch is still active and within expiration date.'}
                            </p>
                        </div>
                    </div>
                `;
            } else {
                title = '📅 Calendar Event';
                content = `
                    <div class="space-y-4">
                        <div class="p-4 bg-primary-50 dark:bg-primary-900 rounded-xl">
                            <h3 class="text-lg font-semibold text-text-primary dark:text-gray-100 mb-2">${escapeHtml(info.event.title)}</h3>
                            <p class="text-sm text-text-secondary dark:text-gray-400">Event Date: ${formattedDate}</p>
                        </div>
                    </div>
                `;
            }

            titleEl.textContent = title;
            contentEl.innerHTML = content;
            modal.classList.remove('hidden');
        }

        // Global functions
        window.openSettings = openSettings;
        window.filterLowStock = filterLowStock;
        window.viewAllActivities = viewAllActivities;
        window.viewOrderDetails = viewOrderDetails;
        window.showCalendarEventModal = showCalendarEventModal;
    </script>

</body>
