<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders - Supplier Portal</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Main Content Wrapper - Padding handled by sidebar component */
        .main-content-wrapper {
            margin-left: 0;
            padding-left: 250px;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (max-width: 1023px) {
            .main-content-wrapper {
                padding-left: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-background transition-colors duration-300">
    <!-- Supplier Sidebar will be loaded here -->
    <script src="../js/load-supplier-sidebar.js"></script>
    <!-- Top Bar will be loaded here -->
    <script src="../js/load-topbar.js" data-title="My Orders" data-description="View and manage all orders placed with you"></script>

    <!-- Main Content -->
    <main class="main-content-wrapper min-h-screen bg-background dark:bg-gray-900">
        <div class="p-6 space-y-6">
        <!-- Page Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-semibold text-text-primary dark:text-gray-100">My Orders</h1>
            <p class="text-text-secondary dark:text-gray-400">View and manage all orders placed with you</p>
        </div>

        <!-- Filters -->
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-4 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center space-x-2">
                    <label for="statusFilter" class="text-sm font-medium text-text-secondary dark:text-gray-400">Status:</label>
                    <select id="statusFilter" class="px-3 py-2 border border-border-light dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-200 bg-white dark:bg-gray-800 text-text-primary dark:text-gray-100">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="processing">Processing</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <label for="dateFrom" class="text-sm font-medium text-text-secondary dark:text-gray-400">From:</label>
                    <input type="date" id="dateFrom" class="px-3 py-2 border border-border-light dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-gray-100" />
                </div>
                <div class="flex items-center space-x-2">
                    <label for="dateTo" class="text-sm font-medium text-text-secondary dark:text-gray-400">To:</label>
                    <input type="date" id="dateTo" class="px-3 py-2 border border-border-light dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-text-primary dark:text-gray-100" />
                </div>
                <button onclick="applyFilters()" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-700">
                    <i class="fas fa-filter mr-2"></i>Apply Filters
                </button>
                <button onclick="resetFilters()" class="px-4 py-2 border border-border-light dark:border-gray-600 rounded-lg hover:bg-surface-hover dark:hover:bg-gray-800">
                    Reset
                </button>
            </div>
        </div>

        <!-- Orders List -->
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 overflow-hidden">
            <div id="ordersList" class="divide-y divide-border-light dark:divide-gray-700">
                <div class="text-center py-8 text-text-secondary dark:text-gray-400">
                    <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-6 flex justify-center"></div>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div id="orderDetailsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white dark:bg-gray-900 border-b border-border-light dark:border-gray-700 px-6 py-4 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-text-primary dark:text-gray-100">Order Details</h2>
                <button onclick="closeOrderModal()" class="text-text-tertiary dark:text-gray-400 hover:text-text-primary dark:hover:text-gray-100">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="orderDetailsContent" class="p-6">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Get supplier ID from localStorage or try to fetch from session
        let supplierId = localStorage.getItem('supplierId');
        let currentPage = 1;
        let pageSize = 25;
        let currentFilters = {};

        // Check authentication - support both session and localStorage
        const supplierLoggedIn = localStorage.getItem('supplierLoggedIn') === 'true' || 
                                 sessionStorage.getItem('supplierLoggedIn') === 'true';
        
        // If supplierId is missing but supplier is logged in, try to get it from session
        if ((!supplierId || supplierId === 'null' || supplierId === 'undefined') && supplierLoggedIn) {
            console.warn('Supplier ID not found in localStorage, attempting to fetch from session...');
            // Try to get supplier ID from PHP session via API
            fetch('../php/get_supplier_session.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.supplier_id) {
                        supplierId = data.supplier_id;
                        localStorage.setItem('supplierId', supplierId);
                        if (data.supplier_name) {
                            localStorage.setItem('supplierName', data.supplier_name);
                        }
                        console.log('Supplier ID retrieved from session:', supplierId);
                        // Reload orders after getting supplier ID
                        loadOrders();
                    } else {
                        console.error('Failed to get supplier ID from session');
                        window.location.href = 'login.html';
                    }
                })
                .catch(error => {
                    console.error('Error fetching supplier session:', error);
                    window.location.href = 'login.html';
                });
        }
        
        // If not logged in or no supplier ID, redirect to main login
        if (!supplierId || supplierId === 'null' || supplierId === 'undefined' || !supplierLoggedIn) {
            if (!supplierLoggedIn) {
                window.location.href = 'login.html';
            }
            // If logged in but no ID, wait for the fetch above to complete
            // Don't redirect immediately
        }

        // Update supplier name if element exists (might be in topbar)
        const supplierNameEl = document.getElementById('supplierName');
        if (supplierNameEl) {
            supplierNameEl.textContent = localStorage.getItem('supplierName') || 'Supplier';
        }

        // Load orders
        async function loadOrders() {
            const ordersList = document.getElementById('ordersList');
            if (!ordersList) {
                console.error('ordersList element not found!');
                return;
            }
            
            ordersList.innerHTML = '<div class="text-center py-8 text-text-secondary dark:text-gray-400"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Loading orders...</p></div>';

            try {
                console.log('Loading orders for supplierId:', supplierId);
                console.log('Current filters:', currentFilters);
                
                // Final check - if supplierId is still missing, try one more time
                if (!supplierId || supplierId === 'null' || supplierId === 'undefined') {
                    // Try to get from localStorage again (in case it was just set)
                    supplierId = localStorage.getItem('supplierId');
                    
                    if (!supplierId || supplierId === 'null' || supplierId === 'undefined') {
                        console.error('Supplier ID is still missing. Redirecting to login...');
                        window.location.href = 'login.html';
                        return;
                    }
                }
                
                let url = `../php/get_supplier_orders.php?supplier_id=${supplierId}&page=${currentPage}&pageSize=${pageSize}`;
                
                if (currentFilters.status) {
                    url += `&status=${encodeURIComponent(currentFilters.status)}`;
                }
                if (currentFilters.dateFrom) {
                    url += `&dateFrom=${encodeURIComponent(currentFilters.dateFrom)}`;
                }
                if (currentFilters.dateTo) {
                    url += `&dateTo=${encodeURIComponent(currentFilters.dateTo)}`;
                }

                console.log('Fetching orders from:', url);
                console.log('Supplier ID from localStorage:', supplierId);
                console.log('Supplier Name from localStorage:', localStorage.getItem('supplierName'));
                
                // Add timeout to fetch request
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 second timeout
                
                const response = await fetch(url, {
                    signal: controller.signal
                }).finally(() => {
                    clearTimeout(timeoutId);
                });
                
                console.log('Response status:', response.status, response.statusText);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('HTTP Error Response:', errorText);
                    throw new Error(`HTTP error! status: ${response.status} - ${errorText}`);
                }
                
                const responseText = await response.text();
                console.log('Raw API Response:', responseText);
                
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON Parse Error:', parseError);
                    console.error('Response text:', responseText);
                    throw new Error('Invalid JSON response from server');
                }
                
                console.log('Parsed API Response:', result);
                console.log('Orders found:', result.data ? result.data.length : 0);
                console.log('Total orders:', result.total || 0);

                if (!result.success) {
                    console.error('API returned error:', result.message);
                    console.error('Debug info:', result.debug);
                    throw new Error(result.message || 'Failed to load orders');
                }

                // Handle response - check if data exists and is an array
                if (result.data !== undefined && result.data !== null && Array.isArray(result.data) && result.data.length > 0) {
                    ordersList.innerHTML = result.data.map(order => `
                        <div class="p-6 hover:bg-surface-hover dark:hover:bg-gray-800 transition-colors duration-200">
                            <div class="flex items-center justify-between mb-4">
                                <div>
                                    <h3 class="text-lg font-semibold text-text-primary dark:text-gray-100">Order #${order.id}</h3>
                                    <p class="text-sm text-text-secondary dark:text-gray-400">${formatDate(order.order_date || order.date)}</p>
                                </div>
                                <div class="flex items-center space-x-4">
                                    <span class="px-3 py-1 text-xs rounded-full ${getStatusClass(order.status)}">
                                        ${formatStatus(order.status)}
                                    </span>
                                    <button onclick="viewOrderDetails(${order.id})" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-700">
                                        View Details
                                    </button>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-4 text-sm">
                                <div>
                                    <p class="text-text-secondary dark:text-gray-400">Items</p>
                                    <p class="font-medium text-text-primary dark:text-gray-100">${order.item_count || 0}</p>
                                </div>
                                <div>
                                    <p class="text-text-secondary dark:text-gray-400">Total Amount</p>
                                    <p class="font-medium text-text-primary dark:text-gray-100">₱${parseFloat(order.total_amount || 0).toFixed(2)}</p>
                                </div>
                                <div>
                                    <p class="text-text-secondary dark:text-gray-400">Status</p>
                                    <p class="font-medium text-text-primary dark:text-gray-100">${formatStatus(order.status)}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // Update pagination
                    updatePagination(result.total || 0, result.pageSize || pageSize);
                } else {
                    ordersList.innerHTML = '<div class="text-center py-8 text-text-secondary dark:text-gray-400"><i class="fas fa-inbox text-4xl mb-4 text-text-tertiary"></i><p>No orders found</p><p class="text-sm mt-2">Orders created by employees will appear here</p></div>';
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                console.error('Error stack:', error.stack);
                
                let errorMessage = 'Please try again later';
                if (error.name === 'AbortError') {
                    errorMessage = 'Request timed out. Please check your connection and try again.';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                
                if (ordersList) {
                    ordersList.innerHTML = `
                        <div class="text-center py-8 text-error-600 dark:text-error-400">
                            <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                            <p class="font-semibold">Error loading orders</p>
                            <p class="text-sm mt-2">${errorMessage}</p>
                            <button onclick="loadOrders()" class="mt-4 px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary-700">
                                <i class="fas fa-redo mr-2"></i>Retry
                            </button>
                        </div>
                    `;
                }
            }
        }

        // View order details
        async function viewOrderDetails(orderId) {
            const modal = document.getElementById('orderDetailsModal');
            const content = document.getElementById('orderDetailsContent');
            
            content.innerHTML = '<div class="text-center py-8"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Loading...</p></div>';
            modal.classList.remove('hidden');

            try {
                const response = await fetch(`../php/get_order_items.php?order_id=${orderId}`);
                const result = await response.json();

                if (result.success) {
                    const items = Array.isArray(result.data) ? result.data : [];
                    const total = items.reduce((sum, item) => sum + (parseFloat(item.price) * parseInt(item.quantity)), 0);

                    content.innerHTML = `
                        <div class="space-y-6">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <p class="text-sm text-text-secondary dark:text-gray-400">Order ID</p>
                                    <p class="font-semibold text-text-primary dark:text-gray-100">#${orderId}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-text-secondary dark:text-gray-400">Total Amount</p>
                                    <p class="font-semibold text-text-primary dark:text-gray-100">₱${total.toFixed(2)}</p>
                                </div>
                            </div>
                            <div>
                                <h3 class="font-semibold text-text-primary dark:text-gray-100 mb-4">Order Items</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full">
                                        <thead class="bg-surface-hover dark:bg-gray-800">
                                            <tr>
                                                <th class="px-4 py-3 text-left text-sm font-semibold text-text-primary dark:text-gray-100">Medicine</th>
                                                <th class="px-4 py-3 text-left text-sm font-semibold text-text-primary dark:text-gray-100">NDC</th>
                                                <th class="px-4 py-3 text-right text-sm font-semibold text-text-primary dark:text-gray-100">Quantity</th>
                                                <th class="px-4 py-3 text-right text-sm font-semibold text-text-primary dark:text-gray-100">Price</th>
                                                <th class="px-4 py-3 text-right text-sm font-semibold text-text-primary dark:text-gray-100">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-border-light dark:divide-gray-700">
                                            ${items.map(item => `
                                                <tr>
                                                    <td class="px-4 py-3 text-sm text-text-primary dark:text-gray-100">${escapeHtml(item.medicine_name || 'N/A')}</td>
                                                    <td class="px-4 py-3 text-sm text-text-secondary dark:text-gray-400">${escapeHtml(item.ndc || '—')}</td>
                                                    <td class="px-4 py-3 text-sm text-right text-text-primary dark:text-gray-100">${item.quantity || 0}</td>
                                                    <td class="px-4 py-3 text-sm text-right text-text-secondary dark:text-gray-400">₱${parseFloat(item.price || 0).toFixed(2)}</td>
                                                    <td class="px-4 py-3 text-sm text-right font-semibold text-text-primary dark:text-gray-100">₱${(parseFloat(item.price || 0) * parseInt(item.quantity || 0)).toFixed(2)}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                        </table>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const msg = result.message ? escapeHtml(result.message) : 'Error loading order details';
                    content.innerHTML = `<div class="text-center py-8 text-error-600 dark:text-error-400">${msg}</div>`;
                }
            } catch (error) {
                console.error('Error loading order details:', error);
                content.innerHTML = '<div class="text-center py-8 text-error-600 dark:text-error-400">Error loading order details</div>';
            }
        }

        function closeOrderModal() {
            document.getElementById('orderDetailsModal').classList.add('hidden');
        }

        function applyFilters() {
            currentFilters = {
                status: document.getElementById('statusFilter').value,
                dateFrom: document.getElementById('dateFrom').value,
                dateTo: document.getElementById('dateTo').value
            };
            currentPage = 1;
            loadOrders();
        }

        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            currentFilters = {};
            currentPage = 1;
            loadOrders();
        }

        function updatePagination(total, size) {
            const totalPages = Math.ceil(total / size);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '<div class="flex items-center space-x-2">';
            
            if (currentPage > 1) {
                html += `<button onclick="changePage(${currentPage - 1})" class="px-4 py-2 border border-border-light dark:border-gray-600 rounded-lg hover:bg-surface-hover dark:hover:bg-gray-800">Previous</button>`;
            }
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button onclick="changePage(${i})" class="px-4 py-2 border border-border-light dark:border-gray-600 rounded-lg ${i === currentPage ? 'bg-primary text-white' : 'hover:bg-surface-hover dark:hover:bg-gray-800'}">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span class="px-2">...</span>';
                }
            }
            
            if (currentPage < totalPages) {
                html += `<button onclick="changePage(${currentPage + 1})" class="px-4 py-2 border border-border-light dark:border-gray-600 rounded-lg hover:bg-surface-hover dark:hover:bg-gray-800">Next</button>`;
            }
            
            html += '</div>';
            pagination.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            loadOrders();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function formatStatus(status) {
            const statusMap = {
                'pending': 'Pending',
                'processing': 'Processing',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            return statusMap[status] || status;
        }

        function getStatusClass(status) {
            const classMap = {
                'pending': 'bg-warning-100 text-warning-800 dark:bg-warning-900 dark:text-warning-200',
                'processing': 'bg-primary-100 text-primary-800 dark:bg-primary-900 dark:text-primary-200',
                'completed': 'bg-success-100 text-success-800 dark:bg-success-900 dark:text-success-200',
                'cancelled': 'bg-error-100 text-error-800 dark:bg-error-900 dark:text-error-200'
            };
            return classMap[status] || 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-200';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('supplierLoggedIn');
            localStorage.removeItem('supplierId');
            localStorage.removeItem('supplierName');
            localStorage.removeItem('supplierEmail');
            sessionStorage.removeItem('supplierLoggedIn');
            // Also call logout API to clear server session
            fetch('../php/logout.php', { method: 'POST' }).then(() => {
                window.location.href = 'login.html';
            }).catch(() => {
                window.location.href = 'login.html';
            });
        }

        // Initialize - wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(loadOrders, 100);
            });
        } else {
            setTimeout(loadOrders, 100);
        }
    </script>
</body>
</html>
