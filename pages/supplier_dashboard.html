<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Dashboard - Inventory Management System</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Main Content Wrapper - Padding handled by sidebar component */
        .main-content-wrapper {
            margin-left: 0;
            padding-left: 60px;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (max-width: 1023px) {
            .main-content-wrapper {
                padding-left: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-background transition-colors duration-300">
    <!-- Supplier Sidebar will be loaded here -->
    <script src="../js/load-supplier-sidebar.js"></script>
    <!-- Top Bar will be loaded here -->
    <script src="../js/load-topbar.js" data-title="Supplier Dashboard" data-description="Manage your orders, products, and view analytics"></script>

    <!-- Main Content -->
    <main class="main-content-wrapper min-h-screen bg-background dark:bg-gray-900">
        <div class="p-6 space-y-6">

        <!-- Key Metrics -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary dark:text-gray-400">Total Orders</p>
                        <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="totalOrders">0</p>
                    </div>
                    <div class="w-12 h-12 bg-primary-100 dark:bg-primary-900 rounded-lg flex items-center justify-center">
                        <i class="fas fa-shopping-cart text-primary-600 dark:text-primary-400"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary dark:text-gray-400">Pending Orders</p>
                        <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="pendingOrders">0</p>
                    </div>
                    <div class="w-12 h-12 bg-warning-100 dark:bg-warning-900 rounded-lg flex items-center justify-center">
                        <i class="fas fa-clock text-warning-600 dark:text-warning-400"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary dark:text-gray-400">Completed Orders</p>
                        <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="completedOrders">0</p>
                    </div>
                    <div class="w-12 h-12 bg-success-100 dark:bg-success-900 rounded-lg flex items-center justify-center">
                        <i class="fas fa-check-circle text-success-600 dark:text-success-400"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary dark:text-gray-400">Total Revenue</p>
                        <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="totalRevenue">₱0.00</p>
                    </div>
                    <div class="w-12 h-12 bg-accent-100 dark:bg-accent-900 rounded-lg flex items-center justify-center">
                        <i class="fas fa-coins text-accent-600 dark:text-accent-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Orders List -->
            <div class="lg:col-span-2 bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold text-text-primary dark:text-gray-100">
                        <i class="fas fa-list mr-2 text-primary-600 dark:text-primary-400"></i>Recent Orders
                    </h2>
                    <button onclick="viewAllOrders()" class="text-sm text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300">
                        View All
                    </button>
                </div>
                <div id="ordersList" class="space-y-4">
                    <div class="text-center py-8 text-text-secondary dark:text-gray-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>Loading orders...</p>
                    </div>
                </div>
            </div>

            <!-- Notifications & Quick Actions -->
            <div class="space-y-6">
                <!-- Notifications -->
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-text-primary dark:text-gray-100">
                            <i class="fas fa-bell mr-2 text-warning-600 dark:text-warning-400"></i>Notifications
                        </h2>
                        <button onclick="markAllRead()" class="text-xs text-text-secondary dark:text-gray-400 hover:text-text-primary dark:hover:text-gray-100">
                            Mark all read
                        </button>
                    </div>
                    <div id="notificationsList" class="space-y-3 max-h-96 overflow-y-auto">
                        <div class="text-center py-4 text-text-secondary dark:text-gray-400">
                            <i class="fas fa-spinner fa-spin mb-2"></i>
                            <p class="text-sm">Loading notifications...</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        </div>
    </main>

    <script>
        // Check authentication - support both session and localStorage
        let supplierId = localStorage.getItem('supplierId');
        const supplierLoggedIn = localStorage.getItem('supplierLoggedIn') === 'true' || 
                                 sessionStorage.getItem('supplierLoggedIn') === 'true';
        
        // If not logged in, redirect to main login
        if (!supplierId || !supplierLoggedIn) {
            window.location.href = 'login.html';
        }


        // Load dashboard data
        async function loadDashboard() {
            await Promise.all([
                loadMetrics(),
                loadOrders(),
                loadNotifications()
            ]);
        }

        // Load metrics
        async function loadMetrics() {
            try {
                const response = await fetch(`../php/get_supplier_metrics.php?supplier_id=${supplierId}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('totalOrders').textContent = result.data.totalOrders || 0;
                    document.getElementById('pendingOrders').textContent = result.data.pendingOrders || 0;
                    document.getElementById('completedOrders').textContent = result.data.completedOrders || 0;
                    document.getElementById('totalRevenue').textContent = '₱' + (parseFloat(result.data.totalRevenue || 0).toFixed(2));
                }
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        // Load orders
        async function loadOrders() {
            try {
                const response = await fetch(`../php/get_supplier_orders.php?supplier_id=${supplierId}&page=1&pageSize=5`);
                const result = await response.json();
                
                const ordersList = document.getElementById('ordersList');
                
                if (result.success && result.data && result.data.length > 0) {
                    ordersList.innerHTML = result.data.map(order => `
                        <div class="border border-border-light dark:border-gray-700 rounded-lg p-4 hover:bg-surface-hover dark:hover:bg-gray-800 transition-colors duration-200">
                            <div class="flex items-center justify-between mb-2">
                                <div>
                                    <p class="font-medium text-text-primary dark:text-gray-100">Order #${order.id}</p>
                                    <p class="text-sm text-text-secondary dark:text-gray-400">${formatDate(order.order_date || order.date)}</p>
                                </div>
                                <span class="px-3 py-1 text-xs rounded-full ${getStatusClass(order.status)}">
                                    ${formatStatus(order.status)}
                                </span>
                            </div>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-sm text-text-secondary dark:text-gray-400">${order.item_count || 0} item(s)</span>
                                <span class="font-semibold text-text-primary dark:text-gray-100">₱${parseFloat(order.total_amount || 0).toFixed(2)}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    ordersList.innerHTML = '<div class="text-center py-8 text-text-secondary dark:text-gray-400">No orders found</div>';
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersList').innerHTML = '<div class="text-center py-8 text-error-600 dark:text-error-400">Error loading orders</div>';
            }
        }

        // Load notifications
        async function loadNotifications() {
            try {
                const response = await fetch(`../php/get_supplier_notifications.php?supplier_id=${supplierId}`);
                const result = await response.json();
                
                const notificationsList = document.getElementById('notificationsList');
                
                if (result.success && result.data && result.data.length > 0) {
                    notificationsList.innerHTML = result.data.map(notif => `
                        <div class="p-3 rounded-lg ${notif.read ? 'bg-surface-hover dark:bg-gray-800' : 'bg-primary-50 dark:bg-primary-900'} border border-border-light dark:border-gray-700">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-text-primary dark:text-gray-100">${escapeHtml(notif.title)}</p>
                                    <p class="text-xs text-text-secondary dark:text-gray-400 mt-1">${escapeHtml(notif.message)}</p>
                                    <p class="text-xs text-text-tertiary dark:text-gray-500 mt-1">${formatDate(notif.created_at)}</p>
                                </div>
                                ${!notif.read ? '<span class="w-2 h-2 bg-primary-600 rounded-full"></span>' : ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    notificationsList.innerHTML = '<div class="text-center py-4 text-text-secondary dark:text-gray-400 text-sm">No notifications</div>';
                }
            } catch (error) {
                console.error('Error loading notifications:', error);
                document.getElementById('notificationsList').innerHTML = '<div class="text-center py-4 text-error-600 dark:text-error-400 text-sm">Error loading notifications</div>';
            }
        }

        // Helper functions
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function formatStatus(status) {
            const statusMap = {
                'pending': 'Pending',
                'processing': 'Processing',
                'completed': 'Completed',
                'cancelled': 'Cancelled'
            };
            return statusMap[status] || status;
        }

        function getStatusClass(status) {
            const classMap = {
                'pending': 'bg-warning-100 text-warning-800 dark:bg-warning-900 dark:text-warning-200',
                'processing': 'bg-primary-100 text-primary-800 dark:bg-primary-900 dark:text-primary-200',
                'completed': 'bg-success-100 text-success-800 dark:bg-success-900 dark:text-success-200',
                'cancelled': 'bg-error-100 text-error-800 dark:bg-error-900 dark:text-error-200'
            };
            return classMap[status] || 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-200';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function viewAllOrders() {
            window.location.href = 'supplier_orders.html';
        }

        function markAllRead() {
            fetch(`../php/mark_notifications_read.php?supplier_id=${supplierId}`, { method: 'POST' })
                .then(() => loadNotifications());
        }


        // Initialize
        loadDashboard();
        
        // Refresh every 30 seconds
        setInterval(loadDashboard, 30000);
    </script>
</body>
</html>
