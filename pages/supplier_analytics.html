<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics - Supplier Portal</title>
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Main Content Wrapper - Padding handled by sidebar component */
        .main-content-wrapper {
            margin-left: 0;
            padding-left: 250px;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (max-width: 1023px) {
            .main-content-wrapper {
                padding-left: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-background transition-colors duration-300">
    <!-- Supplier Sidebar will be loaded here -->
    <script src="../js/load-supplier-sidebar.js"></script>
    <!-- Top Bar will be loaded here -->
    <script src="../js/load-topbar.js" data-title="Analytics" data-description="View your sales data and performance metrics"></script>

    <!-- Main Content -->
    <main class="main-content-wrapper min-h-screen bg-background dark:bg-gray-900">
        <div class="p-6 space-y-6">
            <!-- Metrics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-text-secondary dark:text-gray-400">Total Orders</p>
                            <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="totalOrders">0</p>
                        </div>
                        <div class="w-12 h-12 bg-primary-100 dark:bg-primary-900 rounded-lg flex items-center justify-center">
                            <i class="fas fa-shopping-cart text-primary-600 dark:text-primary-400"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-text-secondary dark:text-gray-400">Pending Orders</p>
                            <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="pendingOrders">0</p>
                        </div>
                        <div class="w-12 h-12 bg-warning-100 dark:bg-warning-900 rounded-lg flex items-center justify-center">
                            <i class="fas fa-clock text-warning-600 dark:text-warning-400"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-text-secondary dark:text-gray-400">Completed Orders</p>
                            <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="completedOrders">0</p>
                        </div>
                        <div class="w-12 h-12 bg-success-100 dark:bg-success-900 rounded-lg flex items-center justify-center">
                            <i class="fas fa-check-circle text-success-600 dark:text-success-400"></i>
                        </div>
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm text-text-secondary dark:text-gray-400">Total Revenue</p>
                            <p class="text-2xl font-bold text-text-primary dark:text-gray-100" id="totalRevenue">₱0.00</p>
                        </div>
                        <div class="w-12 h-12 bg-accent-100 dark:bg-accent-900 rounded-lg flex items-center justify-center">
                            <i class="fas fa-coins text-accent-600 dark:text-accent-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <h2 class="text-lg font-semibold text-text-primary dark:text-gray-100 mb-4">
                        <i class="fas fa-chart-pie mr-2 text-primary-600 dark:text-primary-400"></i>Orders by Status
                    </h2>
                    <div style="height: 280px;">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                <div class="bg-white dark:bg-gray-900 rounded-xl shadow-sm border border-border-light dark:border-gray-700 p-6">
                    <h2 class="text-lg font-semibold text-text-primary dark:text-gray-100 mb-4">
                        <i class="fas fa-chart-line mr-2 text-primary-600 dark:text-primary-400"></i>Revenue Trend
                    </h2>
                    <div style="height: 280px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check authentication
        let supplierId = localStorage.getItem('supplierId');
        const supplierLoggedIn = localStorage.getItem('supplierLoggedIn') === 'true' || 
                                 sessionStorage.getItem('supplierLoggedIn') === 'true';
        
        if (!supplierId || !supplierLoggedIn) {
            window.location.href = 'login.html';
        }

        let statusChart, revenueChart;

        // Load analytics data
        async function loadAnalytics() {
            await Promise.all([
                loadMetrics(),
                loadOrdersForChart()
            ]);
        }

        // Load metrics
        async function loadMetrics() {
            try {
                const response = await fetch(`../php/get_supplier_metrics.php?supplier_id=${supplierId}`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('totalOrders').textContent = result.data.totalOrders || 0;
                    document.getElementById('pendingOrders').textContent = result.data.pendingOrders || 0;
                    document.getElementById('completedOrders').textContent = result.data.completedOrders || 0;
                    document.getElementById('totalRevenue').textContent = '₱' + (parseFloat(result.data.totalRevenue || 0).toFixed(2));
                }
            } catch (error) {
                console.error('Error loading metrics:', error);
            }
        }

        // Load orders for chart
        async function loadOrdersForChart() {
            try {
                const response = await fetch(`../php/get_supplier_orders.php?supplier_id=${supplierId}&page=1&pageSize=1000`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    // Process data for charts
                    const statusCounts = {};
                    const revenueByMonth = {};
                    
                    result.data.forEach(order => {
                        // Status counts
                        const status = order.status || 'pending';
                        statusCounts[status] = (statusCounts[status] || 0) + 1;
                        
                        // Revenue by month
                        if (order.order_date) {
                            const date = new Date(order.order_date);
                            const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                            revenueByMonth[monthKey] = (revenueByMonth[monthKey] || 0) + parseFloat(order.total_amount || 0);
                        }
                    });
                    
                    // Create charts
                    createStatusChart(statusCounts);
                    createRevenueChart(revenueByMonth);
                }
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }

        function createStatusChart(statusCounts) {
            const ctx = document.getElementById('statusChart');
            if (statusChart) {
                statusChart.destroy();
            }
            
            const labels = Object.keys(statusCounts).map(s => s.charAt(0).toUpperCase() + s.slice(1));
            const data = Object.values(statusCounts);
            const colors = {
                'Pending': 'rgb(251, 191, 36)',
                'Processing': 'rgb(59, 130, 246)',
                'Completed': 'rgb(34, 197, 94)',
                'Cancelled': 'rgb(239, 68, 68)'
            };
            
            statusChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: labels.map(l => colors[l] || 'rgb(156, 163, 175)')
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function createRevenueChart(revenueByMonth) {
            const ctx = document.getElementById('revenueChart');
            if (revenueChart) {
                revenueChart.destroy();
            }
            
            const sortedMonths = Object.keys(revenueByMonth).sort();
            const labels = sortedMonths.map(m => {
                const [year, month] = m.split('-');
                const date = new Date(year, month - 1);
                return date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            });
            const data = sortedMonths.map(m => revenueByMonth[m]);
            
            revenueChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue',
                        data: data,
                        borderColor: 'rgb(59, 130, 246)',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '₱' + value.toFixed(2);
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });
        }

        // Initialize
        loadAnalytics();
    </script>
</body>
</html>
